# Simple tmux configuration

# Keep default prefix (Ctrl-b)

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Fast escape time (important for vim/nvim)
set -sg escape-time 0

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Increase scrollback buffer size
set -g history-limit 10000

# Split panes using | and - (more intuitive than % and ")
# Keep current directory when splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Simple, clean status bar
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S "
set -g status-right "#[fg=cyan]%d %b %R"

# Highlight active window in status bar
setw -g window-status-current-style fg=black,bg=green
