format = """
[░▒▓](fg:bright-white)\
$hostname\
[ ](bg:bright-white fg:black)\
[](bg:blue fg:bright-white)\
$directory\
[](fg:blue bg:bright-black)\
$git_branch\
$git_status\
[](fg:bright-black bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""


[character]
success_symbol = '[](bold green)'
error_symbol = '[󰬅](bold red)'

[hostname]
ssh_only = false
format = "[  $hostname  ](bold fg:black bg:bright-white)"

[directory]
format = "[ $path ](bg:blue)"
truncation_length = 5
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:bright-black"
format = '[[ $symbol $branch ](fg:bright-blue bg:bright-black)]($style)'

[git_status]
style = "bg:bright-black"
format = '[[($all_status$ahead_behind )](fg:bright-blue bg:bright-black)]($style)'

[python]
symbol = "" 
pyenv_version_name = true
format = '[[ $symbol ($version) ](fg:bright-blue bg:#212736)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:bright-blue bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:bright-blue bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:bright-blue bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:bright-blue bg:#212736)]($style)'

[time]
disabled = false
time_format = "%I:%M%P" # Hour:Minute Format
use_12hr = true
style = "bg:#1d2230"
format = '[[  $time ](fg:white bg:#1d2230)]($style)'
